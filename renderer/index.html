<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'">
<title>Banafsh</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="s-home" class="screen">
    <div class="center">
      <div id="status" class="muted big-text"></div>
      <div id="orb" class="orb">
        <span class="wave w1"></span><span class="wave w2"></span><span class="spin"></span>
        <button id="big" class="big" aria-label="Connect"></button>
      </div>
    </div>
    <div class="card">
      <span id="cc" class="badge">--</span>
      <div id="addr" class="addr"></div>
      <button id="change" class="btn ghost" data-t="change"></button>
    </div>
    <button id="free" class="btn full" data-t="free"></button>
  </section>

  <section id="s-servers" class="screen" hidden>
    <div class="section-head">
      <div>
        <h1 data-t="stitle"></h1>
        <p class="muted small" data-t="snote"></p>
      </div>
      <button id="test-all" class="btn ghost refresh-btn" data-t="testall"></button>
    </div>
    <div id="list" class="list"></div>
  </section>

  <section id="s-bypass" class="screen" hidden>
    <h1 data-t="btitle"></h1>
    <p class="muted small" data-t="bnote"></p>
    <div class="row">
      <input id="site-in" aria-label="site" dir="ltr">
      <button id="add" class="btn" data-t="add"></button>
    </div>
    <p class="muted tiny" data-t="sub"></p>
    <div id="sites" class="list"></div>
  </section>

  <section id="s-settings" class="screen" hidden>
    <h1 data-t="settings"></h1>

    <h2 data-t="reconnectTitle"></h2>
    <div class="setting-list">
      <label class="setting">
        <span class="setting-text"><strong data-t="autoReconnect"></strong><small data-t="autoReconnectNote"></small></span>
        <input id="auto-reconnect" type="checkbox">
        <span class="switch"></span>
      </label>
      <label class="setting">
        <span class="setting-text"><strong data-t="startupReconnect"></strong><small data-t="startupReconnectNote"></small></span>
        <input id="startup-reconnect" type="checkbox">
        <span class="switch"></span>
      </label>
      <label class="setting select-setting">
        <span class="setting-text"><strong data-t="reconnectAttempts"></strong><small data-t="reconnectAttemptsNote"></small></span>
        <select id="reconnect-attempts" dir="ltr">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="8">8</option><option value="10">10</option>
        </select>
        <span class="muted small" data-t="tries"></span>
      </label>
      <label class="setting select-setting">
        <span class="setting-text"><strong data-t="reconnectDelay"></strong></span>
        <select id="reconnect-delay" dir="ltr">
          <option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="30">30</option><option value="60">60</option>
        </select>
        <span class="muted small" data-t="seconds"></span>
      </label>
    </div>

    <h2 data-t="closeTitle"></h2>
    <div class="setting-list radio-list">
      <label class="setting radio-setting"><span class="setting-text"><strong data-t="closeAsk"></strong></span><input type="radio" name="close-behavior" value="ask"><span class="radio"></span></label>
      <label class="setting radio-setting"><span class="setting-text"><strong data-t="closeKeep"></strong></span><input type="radio" name="close-behavior" value="keep"><span class="radio"></span></label>
      <label class="setting radio-setting"><span class="setting-text"><strong data-t="closeQuit"></strong></span><input type="radio" name="close-behavior" value="quit"><span class="radio"></span></label>
    </div>

    <div class="tray-card">
      <div class="tray-icon">↗</div>
      <div>
        <strong>Banafsh Tray</strong>
        <p class="muted small" data-t="trayNote"></p>
      </div>
    </div>

    <h2 data-t="lang"></h2>
    <div class="row">
      <button id="l-en" class="btn ghost grow">English</button>
      <button id="l-fa" class="btn ghost grow">فارسی</button>
    </div>

    <details class="advanced">
      <summary data-t="advanced"></summary>
      <div class="advanced-body">
        <pre id="log" dir="ltr"></pre>
      </div>
    </details>

    <h2 data-t="about"></h2>
    <div class="card col">
      <div data-t="version"></div>
      <div class="muted small">BANAFSHX</div>
    </div>
  </section>
</main>
<div id="toast" hidden></div>
<nav>
  <button data-tab="home" data-t="home"></button>
  <button data-tab="servers" data-t="servers"></button>
  <button data-tab="bypass" data-t="bypass"></button>
  <button data-tab="settings" data-t="settings"></button>
</nav>
<script src="app.js"></script>
</body>
</html>
